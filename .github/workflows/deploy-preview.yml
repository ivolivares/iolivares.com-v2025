name: Deploy Preview to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: ["cursor/**"]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* must be present at build time — Next.js inlines them into the client bundle.
      # Notion/Draft are needed for SSG/ISR during build and as Worker secrets for runtime revalidation.
      - run: pnpm build:worker
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DRAFT_SECRET_TOKEN: ${{ secrets.DRAFT_SECRET_TOKEN }}
          NEXT_PUBLIC_POSTHOG_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_TOKEN || 'phc_9aA1LgjqHexvljElyfkFEUeKKiAvvTESNqX3oWplIyf' }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Target the preview Worker so secrets are not written to production
          environment: preview
          command: deploy
          secrets: |
            NOTION_TOKEN
            NOTION_DATABASE_ID
            DRAFT_SECRET_TOKEN
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DRAFT_SECRET_TOKEN: ${{ secrets.DRAFT_SECRET_TOKEN }}
